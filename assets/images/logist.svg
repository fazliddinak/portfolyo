<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="logistBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101d" />
      <stop offset="100%" stop-color="#05070e" />
    </linearGradient>
    <linearGradient id="routeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="truckGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#logistBg)" />

  <!-- Frame -->
  <rect x="50" y="40" width="700" height="420" rx="14" fill="#0d1424" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Header -->
  <rect x="50" y="40" width="700" height="44" rx="14" fill="#131c31" />
  <rect x="50" y="70" width="700" height="14" fill="#131c31" />
  <circle cx="76" cy="62" r="5" fill="#ef4444" />
  <circle cx="94" cy="62" r="5" fill="#f59e0b" />
  <circle cx="112" cy="62" r="5" fill="#10b981" />
  <text x="140" y="66" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">logiflow.fazliddin.dev — Enterprise Freight &amp; GPS Logistics Platform</text>

  <!-- Left Sidebar Navigation -->
  <rect x="50" y="84" width="150" height="376" fill="#0c1220" />
  <rect x="65" y="105" width="120" height="28" rx="6" fill="#1e293b" />
  <text x="78" y="123" fill="#38bdf8" font-family="Inter, sans-serif" font-weight="600" font-size="11">🚛 Freights (Yuklar)</text>
  <text x="78" y="157" fill="#64748b" font-family="Inter, sans-serif" font-size="11">📍 GPS Tracking</text>
  <text x="78" y="189" fill="#64748b" font-family="Inter, sans-serif" font-size="11">⚡ Smart Match (98%)</text>
  <text x="78" y="221" fill="#64748b" font-family="Inter, sans-serif" font-size="11">💬 Bidding &amp; Chat</text>
  <text x="78" y="253" fill="#64748b" font-family="Inter, sans-serif" font-size="11">📊 Analytics</text>

  <!-- Top Metrics Bar -->
  <rect x="220" y="100" width="155" height="65" rx="8" fill="#131e33" stroke="#1f2d47" />
  <text x="235" y="122" fill="#64748b" font-family="Inter, sans-serif" font-size="10">FAOL REYSLAR</text>
  <text x="235" y="148" fill="#f8fafc" font-family="Inter, sans-serif" font-weight="700" font-size="18">1,248 reys</text>
  <text x="325" y="148" fill="#10b981" font-family="Inter, sans-serif" font-size="10">Active</text>

  <rect x="390" y="100" width="155" height="65" rx="8" fill="#131e33" stroke="#1f2d47" />
  <text x="405" y="122" fill="#64748b" font-family="Inter, sans-serif" font-size="10">YUK MOSLIGI</text>
  <text x="405" y="148" fill="#38bdf8" font-family="Inter, sans-serif" font-weight="700" font-size="18">98.4 %</text>
  <text x="495" y="148" fill="#38bdf8" font-family="Inter, sans-serif" font-size="10">AI Match</text>

  <rect x="560" y="100" width="160" height="65" rx="8" fill="#131e33" stroke="#1f2d47" />
  <text x="575" y="122" fill="#64748b" font-family="Inter, sans-serif" font-size="10">O'RTACHA NARX</text>
  <text x="575" y="148" fill="#f8fafc" font-family="Inter, sans-serif" font-weight="700" font-size="18">$ 2,450</text>
  <text x="670" y="148" fill="#10b981" font-family="Inter, sans-serif" font-size="10">/ reys</text>

  <!-- Main Map & Route Visualizer -->
  <rect x="220" y="180" width="500" height="255" rx="10" fill="#090f1d" stroke="#1b253b" />
  
  <!-- Subtle Map Grid -->
  <g opacity="0.1" stroke="#38bdf8" stroke-width="1">
    <line x1="220" y1="230" x2="720" y2="230" />
    <line x1="220" y1="280" x2="720" y2="280" />
    <line x1="220" y1="330" x2="720" y2="330" />
    <line x1="220" y1="380" x2="720" y2="380" />
    <line x1="320" y1="180" x2="320" y2="435" />
    <line x1="420" y1="180" x2="420" y2="435" />
    <line x1="520" y1="180" x2="520" y2="435" />
    <line x1="620" y1="180" x2="620" y2="435" />
  </g>

  <!-- GPS Polyline Route -->
  <path d="M 260 380 Q 340 260, 440 310 T 600 240 T 680 230" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />
  <path d="M 260 380 Q 340 260, 440 310 T 600 240 T 680 230" fill="none" stroke="url(#routeGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="6,4" />

  <!-- Origin Marker (Tashkent) -->
  <circle cx="260" cy="380" r="8" fill="#10b981" />
  <circle cx="260" cy="380" r="14" fill="#10b981" fill-opacity="0.25" />
  <text x="260" y="408" fill="#e2e8f0" font-family="Inter, sans-serif" font-weight="600" font-size="11" text-anchor="middle">Tashkent</text>

  <!-- Waypoint / Live GPS Truck Marker -->
  <circle cx="440" cy="310" r="10" fill="#38bdf8" filter="url(#truckGlow)" />
  <circle cx="440" cy="310" r="5" fill="#ffffff" />
  <rect x="400" y="260" width="80" height="24" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
  <text x="440" y="276" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" text-anchor="middle">🚚 ETA 2h 45m</text>

  <!-- Destination Marker (Samarkand) -->
  <circle cx="680" cy="230" r="8" fill="#a855f7" />
  <circle cx="680" cy="230" r="14" fill="#a855f7" fill-opacity="0.25" />
  <text x="680" y="210" fill="#e2e8f0" font-family="Inter, sans-serif" font-weight="600" font-size="11" text-anchor="middle">Samarkand</text>

  <!-- Verified Badge -->
  <rect x="580" y="55" width="150" height="22" rx="11" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
  <circle cx="594" cy="66" r="3.5" fill="#10b981" />
  <text x="604" y="70" fill="#34d399" font-family="Inter, sans-serif" font-weight="600" font-size="10">PRODUCTION READY</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.07" stroke="#3b82f6" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="500" />
    <line x1="320" y1="0" x2="320" y2="500" />
    <line x1="480" y1="0" x2="480" y2="500" />
    <line x1="640" y1="0" x2="640" y2="500" />
  </g>

  <!-- Dashboard Window Frame -->
  <rect x="50" y="40" width="700" height="420" rx="14" fill="#0d1322" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Window Header -->
  <rect x="50" y="40" width="700" height="44" rx="14" fill="#131b2e" />
  <rect x="50" y="70" width="700" height="14" fill="#131b2e" />
  <circle cx="76" cy="62" r="5" fill="#ef4444" />
  <circle cx="94" cy="62" r="5" fill="#f59e0b" />
  <circle cx="112" cy="62" r="5" fill="#10b981" />
  <text x="140" y="66" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">bank-internal-crm.fazliddin.dev — Credit Management System</text>

  <!-- Sidebar -->
  <rect x="50" y="84" width="160" height="376" fill="#0f172a" opacity="0.8" />
  <rect x="68" y="110" width="124" height="28" rx="6" fill="#1e293b" />
  <text x="82" y="128" fill="#38bdf8" font-family="Inter, sans-serif" font-weight="600" font-size="11">📊 Dashboard</text>
  <text x="82" y="162" fill="#64748b" font-family="Inter, sans-serif" font-size="11">💳 Kreditlar</text>
  <text x="82" y="194" fill="#64748b" font-family="Inter, sans-serif" font-size="11">👥 Mijozlar Baza</text>
  <text x="82" y="226" fill="#64748b" font-family="Inter, sans-serif" font-size="11">📈 Analitika</text>
  <text x="82" y="258" fill="#64748b" font-family="Inter, sans-serif" font-size="11">⚙️ Sozlamalar</text>

  <!-- Metrics Cards Row -->
  <rect x="230" y="110" width="150" height="74" rx="8" fill="#131c31" stroke="#22304d" stroke-width="1" />
  <text x="244" y="132" fill="#64748b" font-family="Inter, sans-serif" font-size="10">JAMI KREDITLAR</text>
  <text x="244" y="160" fill="#f8fafc" font-family="Inter, sans-serif" font-weight="700" font-size="18">$ 1,480,250</text>
  <text x="340" y="160" fill="#10b981" font-family="Inter, sans-serif" font-size="10">+14.2%</text>

  <rect x="395" y="110" width="150" height="74" rx="8" fill="#131c31" stroke="#22304d" stroke-width="1" />
  <text x="409" y="132" fill="#64748b" font-family="Inter, sans-serif" font-size="10">FAOL MIJOZLAR</text>
  <text x="409" y="160" fill="#f8fafc" font-family="Inter, sans-serif" font-weight="700" font-size="18">8,429</text>
  <text x="505" y="160" fill="#10b981" font-family="Inter, sans-serif" font-size="10">+8.5%</text>

  <rect x="560" y="110" width="170" height="74" rx="8" fill="#131c31" stroke="#22304d" stroke-width="1" />
  <text x="574" y="132" fill="#64748b" font-family="Inter, sans-serif" font-size="10">QAYTARISH DARAJASI</text>
  <text x="574" y="160" fill="#38bdf8" font-family="Inter, sans-serif" font-weight="700" font-size="18">98.4 %</text>
  <text x="680" y="160" fill="#38bdf8" font-family="Inter, sans-serif" font-size="10">High</text>

  <!-- Big Interactive Chart Area -->
  <rect x="230" y="200" width="500" height="236" rx="8" fill="#111827" stroke="#1f293d" stroke-width="1" />
  <text x="248" y="228" fill="#e2e8f0" font-family="Inter, sans-serif" font-weight="600" font-size="13">Oylik Kredit Dinamikasi &amp; Qarz monitoringi</text>
  <text x="640" y="228" fill="#64748b" font-family="Inter, sans-serif" font-size="11">2026 Q1/Q2</text>

  <!-- Chart Grid Lines -->
  <line x1="250" y1="260" x2="710" y2="260" stroke="#1e293b" stroke-dasharray="3,3" />
  <line x1="250" y1="310" x2="710" y2="310" stroke="#1e293b" stroke-dasharray="3,3" />
  <line x1="250" y1="360" x2="710" y2="360" stroke="#1e293b" stroke-dasharray="3,3" />

  <!-- Gradient Area Chart -->
  <path d="M 260 380 Q 320 330, 380 340 T 500 270 T 620 280 T 700 240 L 700 390 L 260 390 Z" fill="url(#cyanGrad)" />
  <path d="M 260 380 Q 320 330, 380 340 T 500 270 T 620 280 T 700 240" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#glow)" />

  <!-- Chart Data Points -->
  <circle cx="260" cy="380" r="4" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="380" cy="340" r="4" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="500" cy="270" r="4" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="620" cy="280" r="4" fill="#818cf8" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="700" cy="240" r="5" fill="#a855f7" stroke="#ffffff" stroke-width="2" />

  <!-- Badge Verified -->
  <rect x="580" y="55" width="150" height="22" rx="11" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
  <circle cx="594" cy="66" r="3.5" fill="#10b981" />
  <text x="604" y="70" fill="#34d399" font-family="Inter, sans-serif" font-weight="600" font-size="10">PRODUCTION READY</text>

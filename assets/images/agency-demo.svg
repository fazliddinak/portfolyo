<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="agenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14" />
      <stop offset="100%" stop-color="#05060a" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#agenBg)" />

  <rect x="50" y="40" width="700" height="420" rx="14" fill="#0c101c" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Header -->
  <rect x="50" y="40" width="700" height="44" rx="14" fill="#111726" />
  <rect x="50" y="70" width="700" height="14" fill="#111726" />
  <circle cx="76" cy="62" r="5" fill="#ef4444" />
  <circle cx="94" cy="62" r="5" fill="#f59e0b" />
  <circle cx="112" cy="62" r="5" fill="#10b981" />
  <text x="140" y="66" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">nova-agency.concept.demo — Next-Gen Digital Studio Landing</text>

  <!-- Navigation bar mockup -->
  <text x="100" y="125" fill="#ffffff" font-family="Inter, sans-serif" font-weight="800" font-size="16" letter-spacing="1">NOVA<tspan fill="#38bdf8">.</tspan></text>
  <text x="350" y="125" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">Work</text>
  <text x="410" y="125" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">Services</text>
  <text x="480" y="125" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">About</text>
  <rect x="620" y="108" width="90" height="26" rx="13" fill="#38bdf8" />
  <text x="643" y="125" fill="#040812" font-family="Inter, sans-serif" font-weight="600" font-size="10">Let's Talk</text>

  <!-- Big Hero Text -->
  <text x="100" y="210" fill="#64748b" font-family="Inter, sans-serif" font-size="12" letter-spacing="3">DIGITAL DESIGN &amp; DEVELOPMENT</text>
  <text x="100" y="260" fill="url(#textGrad)" font-family="Inter, sans-serif" font-weight="800" font-size="38" letter-spacing="-1">CRAFTING DIGITAL</text>
  <text x="100" y="305" fill="#ffffff" font-family="Inter, sans-serif" font-weight="800" font-size="38" letter-spacing="-1">EXPERIENCES THAT MATTER</text>
  
  <text x="100" y="345" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13">High performance frontend development with Tailwind CSS &amp; React.</text>

  <!-- Interactive Action Buttons -->
  <rect x="100" y="380" width="130" height="38" rx="8" fill="#38bdf8" />
  <text x="125" y="404" fill="#030712" font-family="Inter, sans-serif" font-weight="600" font-size="12">Explore Work →</text>

  <rect x="245" y="380" width="130" height="38" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="272" y="404" fill="#f8fafc" font-family="Inter, sans-serif" font-weight="500" font-size="12">Our Agency</text>

  <!-- Right Visual Element -->
  <g transform="translate(500, 170)">
    <circle cx="100" cy="100" r="90" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.4" />
    <circle cx="100" cy="100" r="60" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.6" />
    <circle cx="100" cy="100" r="30" fill="url(#textGrad)" opacity="0.8" />
  </g>

  <!-- Concept Demo Tag -->
  <rect x="580" y="55" width="150" height="22" rx="11" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="1" />
  <circle cx="594" cy="66" r="3.5" fill="#a855f7" />
  <text x="604" y="70" fill="#c084fc" font-family="Inter, sans-serif" font-weight="600" font-size="10">CONCEPT DEMO</text>
</svg>

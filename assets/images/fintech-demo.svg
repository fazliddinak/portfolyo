<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="finBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16" />
      <stop offset="100%" stop-color="#05070e" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#finBg)" />

  <!-- Frame -->
  <rect x="50" y="40" width="700" height="420" rx="14" fill="#0e1322" stroke="#1f293d" stroke-width="1.5" />
  
  <!-- Header -->
  <rect x="50" y="40" width="700" height="44" rx="14" fill="#131a2b" />
  <rect x="50" y="70" width="700" height="14" fill="#131a2b" />
  <circle cx="76" cy="62" r="5" fill="#ef4444" />
  <circle cx="94" cy="62" r="5" fill="#f59e0b" />
  <circle cx="112" cy="62" r="5" fill="#10b981" />
  <text x="140" y="66" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12">nexus-pay.concept.demo — Modern Digital Wallet &amp; Transfers</text>

  <!-- Left: Glowing Credit Card Mockup -->
  <g transform="translate(90, 110)">
    <rect width="280" height="170" rx="16" fill="url(#cardGrad)" opacity="0.9" filter="drop-shadow(0 15px 25px rgba(168,85,247,0.3))" />
    <!-- Chip -->
    <rect x="25" y="30" width="36" height="28" rx="5" fill="#fef08a" opacity="0.8" />
    <text x="25" y="115" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="16" letter-spacing="2">4532 •••• •••• 8819</text>
    <text x="25" y="145" fill="#f1f5f9" font-family="Inter, sans-serif" font-size="11">FAZLIDDIN AKRAMJONOV</text>
    <text x="210" y="145" fill="#f1f5f9" font-family="Inter, sans-serif" font-size="11">09/29</text>
  </g>

  <!-- Quick Stats -->
  <rect x="90" y="310" width="280" height="120" rx="10" fill="#121829" stroke="#1e293b" />
  <text x="110" y="338" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">Current Balance</text>
  <text x="110" y="372" fill="#ffffff" font-family="Inter, sans-serif" font-weight="700" font-size="24">$ 24,850.00</text>
  <text x="110" y="405" fill="#10b981" font-family="Inter, sans-serif" font-size="11">▲ +$2,410.50 (This month)</text>

  <!-- Right: Recent Transactions Table -->
  <rect x="400" y="110" width="320" height="320" rx="10" fill="#121829" stroke="#1e293b" />
  <text x="420" y="140" fill="#f1f5f9" font-family="Inter, sans-serif" font-weight="600" font-size="13">Recent Activity</text>

  <!-- Row 1 -->
  <circle cx="435" cy="180" r="16" fill="#3b82f6" fill-opacity="0.15" />
  <text x="430" y="184" fill="#38bdf8" font-size="12">↗</text>
  <text x="465" y="178" fill="#e2e8f0" font-family="Inter, sans-serif" font-weight="500" font-size="12">Freelance Payout</text>
  <text x="465" y="194" fill="#64748b" font-family="Inter, sans-serif" font-size="10">Direct Wire • Today</text>
  <text x="650" y="185" fill="#10b981" font-family="Inter, sans-serif" font-weight="600" font-size="12">+$1,200.00</text>

  <!-- Row 2 -->
  <circle cx="435" cy="240" r="16" fill="#ef4444" fill-opacity="0.15" />
  <text x="430" y="244" fill="#f87171" font-size="12">↘</text>
  <text x="465" y="238" fill="#e2e8f0" font-family="Inter, sans-serif" font-weight="500" font-size="12">Cloud Server Hosting</text>
  <text x="465" y="254" fill="#64748b" font-family="Inter, sans-serif" font-size="10">Subscription • Yesterday</text>
  <text x="660" y="245" fill="#ef4444" font-family="Inter, sans-serif" font-weight="600" font-size="12">-$48.00</text>

  <!-- Row 3 -->
  <circle cx="435" cy="300" r="16" fill="#a855f7" fill-opacity="0.15" />
  <text x="430" y="304" fill="#c084fc" font-size="12">⚡</text>
  <text x="465" y="298" fill="#e2e8f0" font-family="Inter, sans-serif" font-weight="500" font-size="12">Software License</text>
  <text x="465" y="314" fill="#64748b" font-family="Inter, sans-serif" font-size="10">Digital Tools • Nov 10</text>
  <text x="655" y="305" fill="#ef4444" font-family="Inter, sans-serif" font-weight="600" font-size="12">-$120.00</text>

  <!-- Concept Demo Tag -->
  <rect x="580" y="55" width="150" height="22" rx="11" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="1" />
  <circle cx="594" cy="66" r="3.5" fill="#a855f7" />
  <text x="604" y="70" fill="#c084fc" font-family="Inter, sans-serif" font-weight="600" font-size="10">CONCEPT DEMO</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1021" />
      <stop offset="50%" stop-color="#07090f" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="outerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Circle -->
  <circle cx="200" cy="200" r="190" fill="url(#avatarBg)" stroke="url(#neonGlow)" stroke-width="3" filter="url(#outerGlow)" />
  <circle cx="200" cy="200" r="175" fill="#080c18" stroke="#1e293b" stroke-width="1.5" />

  <!-- Background Code Ring Particles -->
  <g opacity="0.3" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,8">
    <circle cx="200" cy="200" r="160" fill="none" />
  </g>

  <!-- Glowing Aura Backing -->
  <circle cx="200" cy="180" r="110" fill="#3b82f6" opacity="0.12" filter="url(#outerGlow)" />
  <circle cx="200" cy="190" r="80" fill="#a855f7" opacity="0.15" filter="url(#outerGlow)" />

  <!-- Stylized Developer Silhouette -->
  <!-- Shoulders & Hoodie -->
  <path d="M 90 360 C 100 290, 140 260, 200 260 C 260 260, 300 290, 310 360 Z" fill="#131b2e" stroke="#253556" stroke-width="2" />
  <!-- Hoodie Zipper / Trim -->
  <path d="M 198 260 L 198 360" stroke="#38bdf8" stroke-width="2.5" opacity="0.8" />
  <!-- Collar -->
  <path d="M 160 260 Q 200 285 240 260" fill="none" stroke="#60a5fa" stroke-width="2" />

  <!-- Neck -->
  <rect x="180" y="220" width="40" height="45" rx="6" fill="#e2e8f0" opacity="0.9" />

  <!-- Head / Face Base -->
  <path d="M 145 170 C 145 110, 255 110, 255 170 C 255 225, 225 240, 200 240 C 175 240, 145 225, 145 170 Z" fill="#f8fafc" />

  <!-- Modern Hair -->
  <path d="M 140 160 C 135 110, 160 90, 200 90 C 245 90, 265 115, 260 165 C 250 145, 240 135, 220 135 C 190 135, 175 145, 140 160 Z" fill="#0f172a" />
  
  <!-- Cyber Glasses / AR Visor -->
  <rect x="155" y="160" width="90" height="24" rx="12" fill="#030712" stroke="url(#neonGlow)" stroke-width="2" filter="url(#outerGlow)" />
  <rect x="160" y="165" width="36" height="14" rx="7" fill="#00f0ff" opacity="0.75" />
  <rect x="204" y="165" width="36" height="14" rx="7" fill="#a855f7" opacity="0.75" />

  <!-- Neon Headphones -->
  <!-- Band -->
  <path d="M 135 160 C 130 95, 270 95, 265 160" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />
  <!-- Ear Cups -->
  <rect x="126" y="150" width="16" height="42" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
  <rect x="258" y="150" width="16" height="42" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="2" />

  <!-- Subtle Smile -->
  <path d="M 188 212 Q 200 220 212 212" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" />

  <!-- Floating Coding Accent Badges -->
  <g transform="translate(45, 120)">
    <rect width="60" height="28" rx="14" fill="#0e172a" stroke="#38bdf8" stroke-width="1.5" />
    <text x="30" y="18" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">&lt;React/&gt;</text>
  </g>

  <g transform="translate(295, 120)">
    <rect width="60" height="28" rx="14" fill="#0e172a" stroke="#a855f7" stroke-width="1.5" />
    <text x="30" y="18" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">Tailwind</text>
  </g>

  <g transform="translate(170, 335)">
    <rect width="60" height="24" rx="12" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
    <circle cx="182" cy="347" r="3" fill="#10b981" />
    <text x="204" y="350" fill="#34d399" font-family="Inter, sans-serif" font-size="9" font-weight="700" text-anchor="middle">ACTIVE</text>
  </g>
</svg>
